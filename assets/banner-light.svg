  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#12131A" font-size="52" font-weight="700" letter-spacing="-1.2">Muhammad Hamza Aslam</text>
    <text x="74" y="176" fill="#5A6076" font-size="22" letter-spacing="0.2">I build local-first media tools that replace paid SaaS.</text>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15">
      <text x="74" y="236" fill="#5B49E8">clip</text>
      <text x="122" y="236" fill="#B3B8C8">/</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Muhammad Hamza Aslam — local-first media tools">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B49E8"/>
      <stop offset="50%" stop-color="#0FA3C4"/>
      <stop offset="100%" stop-color="#5B49E8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F5FA"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0FA3C4"/>
      <stop offset="100%" stop-color="#5B49E8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0A0A10" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#fade)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.9"/>

  <g fill="url(#bars)">
